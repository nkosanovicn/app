<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Razvitak</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Razvitak: Instagram vašeg salona na jednom mestu.">
<link rel="manifest" href="manifest.json?v=44">
<link rel="icon" type="image/png" sizes="192x192" href="ikona-192.png?v=44">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Razvitak">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --pozadina:#FFFFFF; --povrsina:#FFFFFF; --mastilo:#1E211A; --tiho:#6B6E66; --linija:#E8E9E4; --tiho-poz:#F5F6F2;
  --orhideja:#5F7033; --orhideja-svetla:#EFF2E6; --rumenilo:#F6EFDD; --zlato:#D9A63A; --menta:#2F8F6B; --cilibar:#B26E00; --cilibar-svetli:#FCF0DC;
  --na-orhideji:#FFFFFF; --radius-veliki:22px; --radius:14px; --radius-mali:9px;
  --display:"Space Grotesk", system-ui, sans-serif; --telo:"DM Sans", system-ui, sans-serif; --broj:"DM Mono", ui-monospace, monospace;
}
:root.tamno{
  --pozadina:#111210; --povrsina:#191A17; --mastilo:#ECEDE8; --tiho:#9C9F95; --linija:#2C2E29; --tiho-poz:#1F201C;
  --orhideja:#B8CB7C; --orhideja-svetla:#262A1F; --rumenilo:#3A3220; --zlato:#E2B451; --menta:#6CCFA4; --cilibar:#F0B451; --cilibar-svetli:#3D2F1A; --na-orhideji:#151A0C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--pozadina);color:var(--mastilo);font-family:var(--telo);font-size:16px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--orhideja);outline-offset:2px}
img{display:block;max-width:100%}
.omot{max-width:560px;margin:0 auto;padding:18px 18px 0}

/* zaglavlje */
.zaglavlje{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-18px -18px 16px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;position:sticky;top:0;z-index:6;background:var(--pozadina);box-shadow:0 1px 0 var(--linija)}
:root{--logo:#5F7033;--logo-ekran:#F7F3E6;color-scheme:light}
:root.tamno{--logo:#B8CB7C;--logo-ekran:#262A1F;color-scheme:dark}
.znak{display:flex;align-items:center;gap:10px}
.znak svg{width:34px;height:38px}
.znak svg.okrugli{width:52px;height:52px;flex:none}
body{overflow-x:clip}
.desno{flex:1;justify-content:flex-end}
.desno #salonMesto{min-width:0;flex:1;display:flex;justify-content:flex-end}
.desno .salon-ime{max-width:100%}
.znak b{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.01em;color:var(--mastilo)}
.salon-izbor{appearance:none;background:var(--povrsina);border:1px solid var(--linija);border-radius:999px;padding:8px 32px 8px 14px;font:500 14px var(--telo);color:var(--mastilo);max-width:200px;
  background-image:linear-gradient(45deg,transparent 50%,var(--tiho) 50%),linear-gradient(135deg,var(--tiho) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.salon-dugme{display:inline-flex;align-items:center;gap:6px;background:var(--povrsina);border:1px solid var(--linija);border-radius:999px;padding:8px 10px 8px 12px;font:500 14px var(--telo);color:var(--mastilo);max-width:150px}
.salon-dugme span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.salon-dugme svg{width:14px;height:14px;flex:none;stroke:var(--tiho)}
#salonMesto{position:relative}
.salon-meni{position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:220px;max-width:280px;max-height:60vh;overflow:auto;background:var(--povrsina);border:1px solid var(--linija);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px}
.salon-meni button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font:500 15px var(--telo);color:var(--mastilo)}
.salon-meni button:hover,.salon-meni button:focus-visible{background:var(--tiho-poz)}
.salon-meni button[aria-current="true"]{font-weight:700}
.salon-meni button[aria-current="true"]::after{content:"✓";color:var(--tiho)}
.salon-meni .svi{border-top:1px solid var(--linija);border-radius:0 0 10px 10px;margin-top:4px;color:var(--tiho);font-size:14px}
.galerija .reels-mesto{flex:none;width:100%;height:220px;display:grid;place-items:center;border-radius:var(--radius);background:var(--tiho-poz);font-size:15px;color:var(--tiho);text-align:center;padding:16px}
.listic.klik{cursor:pointer}
.saloni{display:grid;gap:14px;margin-top:22px}
.salon-kartica{background:var(--povrsina);border:1px solid var(--linija);border-radius:var(--radius);overflow:hidden}
.salon-kartica.trenutni{box-shadow:inset 3px 0 0 var(--orhideja)}
.salon-glava{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 16px 6px}
.salon-glava h3{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.salon-glava p{font-size:13px;color:var(--tiho);margin-top:3px}
.salon-glava p .upozorenje{color:#B4532A;font-weight:600}
.salon-glava .oznaka{font-size:12px;font-weight:600;color:var(--orhideja);background:var(--orhideja-svetla);border-radius:999px;padding:4px 10px;flex:none}
.salon-glava svg{width:18px;height:18px;stroke:var(--tiho);flex:none}
.salon-brojke{display:grid;grid-template-columns:repeat(3,1fr);padding:10px 16px 12px;gap:8px}
.salon-brojke div{display:flex;flex-direction:column}
.salon-brojke b{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.salon-brojke b small{font-size:14px;color:var(--tiho);font-weight:500}
.salon-brojke span{font-size:13px;color:var(--tiho)}
.salon-brojke .vazno b{color:var(--orhideja)}
.salon-radnje{display:flex;gap:8px;padding:0 16px 16px}
.salon-radnje .cip{flex:1;justify-content:center;display:inline-flex;font-weight:600}
.salon-ime{font-size:14px;color:var(--tiho);text-align:right;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tipografija */
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.08;letter-spacing:-.025em}
h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.015em;margin:30px 0 12px}
.pod{color:var(--tiho);font-size:15px;margin-top:6px}

/* sledeca objava: list iz knjige zakazivanja */
.listic{margin-top:22px;display:grid;grid-template-columns:86px 1fr;background:var(--povrsina);border-radius:var(--radius-veliki);overflow:hidden;border:1px solid var(--linija);box-shadow:0 16px 36px -30px rgba(30,33,26,.35)}
.listic .vreme{background:var(--tiho-poz);color:var(--mastilo);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 6px;position:relative}
.listic .vreme::after{content:"";position:absolute;right:-7px;top:0;bottom:0;width:14px;background:radial-gradient(circle at 7px 9px,var(--povrsina) 4px,transparent 4.5px) 0 0/14px 18px repeat-y}
.listic .dan{font-size:13px;color:var(--tiho);text-transform:lowercase}
.listic .sat{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;color:var(--orhideja)}
.listic .sadrzaj{display:flex;gap:14px;align-items:center;padding:14px 16px 14px 20px;min-height:110px}
.listic .sadrzaj img,.slicica{width:72px;height:90px;border-radius:var(--radius-mali);object-fit:cover;flex:none;background:var(--rumenilo)}
.listic .naslov{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.listic .napomena{font-size:13px;color:var(--tiho);margin-top:4px}
.listic.prazan .sadrzaj{color:var(--tiho)}

/* mesecni ucinak: zupci cesljа */
.mesec{margin-top:26px}
.mesec .red{display:flex;justify-content:space-between;align-items:baseline}
.mesec .broj{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.mesec .broj small{font-size:16px;color:var(--tiho);font-weight:500}
.zupci{display:flex;gap:4px;margin-top:10px;height:34px;align-items:flex-end}
.zupci i{flex:1;max-width:22px;height:100%;border-radius:4px 4px 2px 2px;background:var(--linija)}
.zupci i.pun{background:var(--orhideja)}
.dodatno{display:grid;gap:14px;margin-top:4px}
.dodatno div{display:grid;grid-template-columns:64px 1fr 60px;align-items:center;gap:12px;font-size:15px}
.dodatno span{color:var(--tiho)}
.dodatno .mini{height:8px;border-radius:99px;background:var(--linija);overflow:hidden}
.dodatno .mini i{display:block;height:100%;background:var(--orhideja);border-radius:99px}
.dodatno b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.dodatno b small{color:var(--tiho);font-weight:500;font-size:14px}
img.pala{object-fit:contain!important;background:var(--orhideja-svetla)}
.mikrofon-red{display:flex;align-items:center;gap:10px;margin-top:10px}
.mikrofon-red small{color:var(--tiho);font-size:13px}
.opis .hestegovi{display:block;margin-top:12px;color:var(--orhideja);font-size:14px;line-height:1.5;white-space:normal}
.svoja-izmena{margin-top:14px}
.svoja-izmena .dugme.sporedno{margin-top:10px;width:100%}
.dugme.sporedno{background:var(--povrsina);color:var(--orhideja);border:1.5px solid var(--orhideja)}
.dugme.sporedno:disabled{opacity:.45}
.dugmad.dole{margin-top:22px;padding-top:18px;border-top:1px solid var(--linija)}
.odmah-link{display:block;width:100%;margin-top:12px;padding:10px;font:600 15px var(--telo);color:var(--orhideja);text-align:center;border-radius:10px}
.odmah-link.potvrdi{background:var(--orhideja);color:#fff}
.odmah-link:disabled{opacity:.5}
.svoja-izmena .mikrofon-red{display:flex;gap:8px;align-items:center;margin-top:8px}
.napomena-izmena{display:block;margin-top:10px;color:var(--tiho);font-size:13px;line-height:1.4}
.cip.mik{display:inline-flex;align-items:center;gap:7px;color:var(--orhideja);border-color:var(--orhideja-svetla);font-weight:600}
.cip.mik svg{width:17px;height:17px;stroke:currentColor}
.cip.mik.snima{background:var(--orhideja);color:var(--na-orhideji);border-color:var(--orhideja)}
.cip.mik.snima::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:puls 1s ease-in-out infinite}
@keyframes puls{50%{opacity:.25}}
.zupci i.pun:nth-child(odd){height:86%}
.zupci i:not(.pun):nth-child(odd){height:86%}

/* ceka odobrenje */
.ceka{margin-top:24px;background:var(--cilibar-svetli);border-radius:var(--radius);padding:14px 16px;display:flex;gap:14px;align-items:center}
.ceka .slike{display:flex}
.ceka .slike img,.ceka .slike span{width:40px;height:50px;border-radius:7px;object-fit:cover;border:2px solid var(--cilibar-svetli);margin-left:-12px;background:var(--rumenilo)}
.ceka .slike :first-child{margin-left:0}
.ceka p{font-size:14px;flex:1}
.ceka strong{color:var(--cilibar);display:block;font-size:15px}

/* brze radnje */
.radnje{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.radnja{background:var(--povrsina);border:1px solid var(--linija);border-radius:var(--radius);padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px}
.radnja svg{width:28px;height:28px;stroke:var(--orhideja)}
.radnja:active{transform:scale(.97)}

/* plan */
.dan-blok{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--linija)}
.dan-blok:last-child{border-bottom:0}
.dan-oznaka{font-size:13px;color:var(--tiho);line-height:1.25;padding-top:4px}
.dan-oznaka b{display:block;font-family:var(--display);font-size:22px;color:var(--mastilo);font-weight:700}
.termin{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.termin:last-child{margin-bottom:0}
.termin .sat-cip{font-family:var(--display);font-weight:700;font-size:15px;min-width:42px}
.termin .zauzet{flex:1;text-align:left;display:flex;gap:10px;align-items:center;background:var(--povrsina);border-radius:var(--radius-mali);padding:6px;box-shadow:0 1px 0 var(--linija)}
.termin .zauzet img,.termin .zauzet .ikona-reels{width:40px;height:50px;border-radius:7px;object-fit:cover;background:var(--rumenilo);flex:none;display:grid;place-items:center}
.termin .zauzet span{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.termin .slobodan{flex:1;border:1.5px dashed var(--linija);border-radius:var(--radius-mali);padding:14px 12px;font-size:14px;color:var(--tiho)}
button.slobodan{text-align:left;color:var(--orhideja);font-weight:600;background:none}
.termin .zauzet .pin{font-size:12px;color:var(--orhideja);font-weight:600;display:block;margin-top:2px}
.izbor-termina{display:grid;gap:8px;margin-top:12px}
.izbor-termina button{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid var(--linija);border-radius:12px;background:var(--povrsina);font:500 15px var(--telo);color:var(--mastilo);text-align:left}
.izbor-termina button small{color:var(--tiho);font-weight:400}
.izbor-termina button[aria-current="true"]{border-color:var(--orhideja);font-weight:700}
.opcije-slota{display:grid;gap:10px;margin-top:14px}
.premesti{display:grid;gap:8px;margin-top:8px}
.premesti button{display:flex;gap:10px;align-items:center;text-align:left;padding:6px;border:1px solid var(--linija);border-radius:12px;background:var(--povrsina);font-size:14px}
.premesti img{width:40px;height:50px;object-fit:cover;border-radius:7px;flex:none}
.akcije-zakazane{display:grid;gap:10px;margin-top:18px}

/* objave */
.mreza{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:var(--radius);overflow:hidden}
.mreza button{position:relative;aspect-ratio:4/5;background:var(--rumenilo)}
.mreza img{width:100%;height:100%;object-fit:cover}
.mreza .oznaka{position:absolute;top:6px;right:6px;background:rgba(18,22,10,.6);color:#fff;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px}

/* brojke */
.pratioci{display:flex;align-items:baseline;gap:10px}
.pratioci .veliki{font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:-.04em;line-height:.95}
.metrike{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linija);border-radius:var(--radius);overflow:hidden;margin-top:18px}
.metrike div{background:var(--povrsina);padding:14px 12px}
.metrike b{display:block;font-family:var(--display);font-size:24px;font-weight:700}
.metrike span{font-size:13px;color:var(--tiho)}
.grafikon{background:var(--povrsina);border-radius:var(--radius);padding:16px 14px 10px}
.grafikon svg{width:100%;height:120px;display:block}
.grafikon .ose{display:flex;justify-content:space-between;font-size:12px;color:var(--tiho);margin-top:6px}
.trake div{display:grid;grid-template-columns:88px 1fr 34px;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
.trake .traka{height:10px;border-radius:5px;background:var(--linija);overflow:hidden}
.trake .traka i{display:block;height:100%;background:var(--orhideja);border-radius:5px}
.trake em{font-style:normal;color:var(--tiho);text-align:right;font-size:13px}

/* donja traka */
nav.dno{position:fixed;left:0;right:0;bottom:0;background:var(--povrsina);border-top:1px solid var(--linija);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.dno button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--tiho);padding:4px 0}
nav.dno svg{width:24px;height:24px;stroke:currentColor}
nav.dno button[aria-current="page"]{color:var(--orhideja);font-weight:600}

/* donji panel */
.zavesa{position:fixed;inset:0;background:rgba(18,22,10,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.zavesa.otvorena{opacity:1;pointer-events:auto}
.panel{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--povrsina);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;z-index:11;max-width:560px;margin:0 auto}
.panel.otvoren{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.panel .rucka{width:44px;height:5px;border-radius:3px;background:var(--linija);margin:0 auto 16px;cursor:grab;box-shadow:0 0 0 14px transparent;position:relative}
.panel .rucka::before{content:"";position:absolute;inset:-14px -40px}
.panel h3{font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:8px}
.panel p{color:var(--tiho);margin-bottom:12px}
.panel ol{margin:0 0 18px 20px;display:grid;gap:8px}
.panel .velika-slika{width:100%;border-radius:var(--radius);margin-bottom:14px;max-height:52vh;object-fit:cover;background:var(--rumenilo)}
.panel .opis{white-space:pre-wrap;color:var(--mastilo);font-size:15px}
.dugme{display:block;width:100%;background:var(--orhideja);color:var(--na-orhideji);border-radius:var(--radius);padding:15px;font-weight:600;font-size:16px;text-align:center}
.dugme.drugo{background:var(--orhideja-svetla);color:var(--orhideja);margin-top:8px}

/* stanja */
.prazno{text-align:center;color:var(--tiho);padding:40px 10px}
.traka-primer{background:var(--tiho-poz);color:var(--tiho);border:1px solid var(--linija);font-size:13px;border-radius:var(--radius-mali);padding:8px 12px;margin-bottom:16px}
.ucitavanje .kost{background:linear-gradient(90deg,var(--linija),var(--povrsina),var(--linija));background-size:200% 100%;animation:sija 1.2s infinite;border-radius:var(--radius)}
@keyframes sija{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* pregled i radnje */
.galerija{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px 14px;padding:0 20px}
.galerija img{flex:none;width:78%;max-height:42vh;object-fit:cover;border-radius:var(--radius);scroll-snap-align:center;background:var(--rumenilo)}
.galerija img:only-child{width:100%}
.galerija.uspravno img{object-fit:contain;background:var(--mastilo)}
.dugmad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.dugme.ne{background:var(--povrsina);color:var(--mastilo);border:1px solid var(--linija)}
.cipovi{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cip{border:1px solid var(--linija);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;background:var(--povrsina)}
.dugme[disabled],.cip[disabled]{opacity:.55}
.lista-ceka button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--linija)}
.lista-ceka button:last-child{border-bottom:0}
.lista-ceka img,.lista-ceka .ikona-reels{width:52px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--rumenilo);display:grid;place-items:center}
.lista-ceka span{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.ig-nalog{display:flex;align-items:center;gap:12px;padding:4px 0}

.ig-nalog small{display:block;font-size:13px;color:var(--tiho);margin-top:2px}

<script>
/* automatsko ažuriranje: ako na serveru postoji novija verzija, stranica se sama učita ponovo */
const VERZIJA = '2026-11-19.60';
async function proveriVerziju() {
  try {
    const odg = await fetch('verzija.json?t=' + Date.now(), { cache: 'no-store' });
    const v = (await odg.json()).verzija;
    if (!v || v === VERZIJA) return;
    const q = new URLSearchParams(location.search);
    if (q.get('v') === v) return; // već smo probali, ne vrti u krug
    q.set('v', v); location.replace(location.pathname + '?' + q.toString() + location.hash);
  } catch (e) {}
}
proveriVerziju();
document.addEventListener('visibilitychange', () => { if (!document.hidden) proveriVerziju(); });
const API = 'https://miroslavmiki.app.n8n.cloud/webhook/blade-app-api';
const tg = window.Telegram && window.Telegram.WebApp;
const uTelegramu = !!(tg && tg.initData);
const BOT = 'kaodajebitno_bot';
const API_PRIJAVA = 'https://miroslavmiki.app.n8n.cloud/webhook/blade-app-prijava';
const uOkviru = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const samostalno = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const iPhone = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const skladiste = {
  uzmi: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  stavi: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
};
let token = uTelegramu ? '' : skladiste.uzmi('blade_token');
let demo = !uTelegramu && (uOkviru || new URLSearchParams(location.search).has('demo'));
const demoVrsta = new URLSearchParams(location.search).get('demo') === 'hrana' ? 'hrana' : 'salon';
const jeHrana = () => demo && demoVrsta === 'hrana';
let podaci = null, tab = (() => { try { return sessionStorage.getItem('razvitak_tab') || 'pocetna'; } catch (e) { return 'pocetna'; } })(), kodIzbor = '';
const pravo = () => uTelegramu || (!!token && !demo);
const prijava = () => uTelegramu ? { initData: tg.initData } : { token };
/* pamćenje poslednjih podataka u telefonu: otvaranje je trenutno, pa se tiho osveži */
const kljucKes = () => 'blade_kes_' + (uTelegramu ? String((tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 'tg') : token.slice(0, 16));
function sacuvajKes() { if (!pravo() || !podaci || !podaci.salon) return; try { localStorage.setItem(kljucKes(), JSON.stringify({ kod: podaci.salon.kod, t: Date.now(), p: podaci })); } catch (e) {} }
function uzmiKes() {
  try { const k = JSON.parse(localStorage.getItem(kljucKes()) || 'null'); const zeljeni = kodIzbor || skladiste.uzmi('blade_salon');
    if (!k || (zeljeni && k.kod !== zeljeni) || Date.now() - k.t > 14 * 864e5) return null; return k.p; } catch (e) { return null; }
}
function obrisiKes() { try { Object.keys(localStorage).filter(k => k.startsWith('blade_kes_')).forEach(k => localStorage.removeItem(k)); } catch (e) {} }
let statVreme = 0;
const cistOpis = t => String(t ?? '').replace(/\\r\\n|\\n/g, '\n');
function primi(j) {
  ['ceka', 'objavljeno'].forEach(k => (j[k] || []).forEach(o => { if (o && o.caption) o.caption = cistOpis(o.caption); }));
  (j.plan || []).forEach(t => { if (t && t.objava && t.objava.caption) t.objava.caption = cistOpis(t.objava.caption); });
  const isti = podaci && podaci.salon && j.salon && podaci.salon.kod === j.salon.kod;
  const stat = isti ? podaci.stat : undefined;
  podaci = j;
  if (stat === undefined) { delete podaci.stat; statVreme = 0; } else podaci.stat = stat;
  sacuvajKes();
}
let igKes = { kod: null, vreme: 0, ig: null };
async function ucitajStat() {
  if (!pravo() || !podaci || Date.now() - statVreme < 30 * 60 * 1000) return;
  statVreme = Date.now(); const kod = podaci.salon.kod;
  try {
    const odg = await fetch(API, { method: 'POST', body: new URLSearchParams({ ...prijava(), kod, deo: 'stat' }) });
    if (odg.status === 401 && !uTelegramu) return istekla();
    const j = await odg.json(); if (!j.ok) throw new Error();

function planKalendar() {
  const danas = new Date(); danas.setHours(0, 0, 0, 0);
  if (!kalMesec) kalMesec = new Date(danas.getFullYear(), danas.getMonth(), 1);
  if (!kalDan) kalDan = kljucDana(danas);
  const g = kalMesec.getFullYear(), m = kalMesec.getMonth();
  const dog = {}; const dodaj = (k, x) => (dog[k] = dog[k] || []).push(x);
  (podaci.plan || []).forEach(t => { const d = datumTermina(t); if (d) dodaj(kljucDana(d), { v: t.objava ? 'zakazano' : 'slobodno', t, d }); });
  (podaci.objavljeno || []).forEach(x => { if (x.datum) { const d = new Date(x.datum); dodaj(kljucDana(d), { v: 'objavljeno', x, d }); } });
  const pr = [...praznici(g - 1), ...praznici(g), ...praznici(g + 1)];
  pr.forEach(p => dodaj(p.k, { v: 'praznik', p }));
  const prvi = new Date(g, m, 1), brojDana = new Date(g, m + 1, 0).getDate(), pomak = (prvi.getDay() + 6) % 7;
  let celije = ''; for (let i = 0; i < pomak; i++) celije += '<span></span>';
  for (let dan = 1; dan <= brojDana; dan++) {
    const k = kljucDana(new Date(g, m, dan)), e = dog[k] || [];
    const tacke = [e.some(x => x.v === 'zakazano') ? '<i class="t-zak"></i>' : '', e.some(x => x.v === 'objavljeno') ? '<i class="t-obj"></i>' : '', e.some(x => x.v === 'slobodno') && !e.some(x => x.v === 'zakazano') ? '<i class="t-slo"></i>' : ''].join('');
    const p = e.find(x => x.v === 'praznik');
    celije += `<button class="kal-dan${k === kljucDana(danas) ? ' danas' : ''}" data-kdan="${k}" aria-pressed="${k === kalDan}" aria-label="${dan}. ${MESECI_GEN[m]}${p ? ', ' + esc(p.p.ime) : ''}">${p ? `<em aria-hidden="true">${p.p.em}</em>` : ''}<b>${dan}</b><span class="tacke">${tacke}</span></button>`;
  }
  const izabran = dog[kalDan] || [];
  const [kg, km, kd] = kalDan.split('-').map(Number);
  const red = x => {
    if (x.v === 'zakazano') return `<button class="kal-stavka" data-id="${x.t.objava.id}" data-izvor="plan">${slika(x.t.objava)}<span><small>Zakazano u ${esc(x.t.sat)}</small>${esc(prvaRecenica(x.t.objava.caption))}</span></button>`;
    if (x.v === 'objavljeno') return `<button class="kal-stavka" data-id="${x.x.id}" data-izvor="objavljeno">${slika(x.x)}<span><small>Objavljeno</small>${esc(prvaRecenica(x.x.caption))}</span></button>`;
    if (x.v === 'slobodno') return x.t.kljuc ? `<button class="kal-slobodno" data-slot="${esc(x.t.kljuc)}">+ Dodaj objavu za ${esc(x.t.sat)}</button>` : '';
    return `<div class="praznik-kartica"><span class="em" aria-hidden="true">${x.p.em}</span><div><b>${esc(x.p.ime)}</b><small>${esc(x.p.tema)}</small><button class="cip" data-praznik="${x.p.k}">Napravi objavu</button></div></div>`;
  };
  const uskoro = narednaPraznici(4);
  document.getElementById('planTelo').innerHTML = `<div class="kal">
      <div class="kal-glava"><button class="kal-str" id="kalNazad" aria-label="Prethodni mesec">‹</button><b>${MESECI[m].charAt(0).toUpperCase() + MESECI[m].slice(1)} ${g}</b><button class="kal-str" id="kalNapred" aria-label="Sledeći mesec">›</button></div>
      <div class="kal-mreza">${DANI_K.map(x => `<span class="kal-ime">${x}</span>`).join('')}${celije}</div>

    </div>

    <div class="kal-detalj">${izabran.length ? izabran.sort((a, b) => (a.v === 'praznik' ? -1 : 0) - (b.v === 'praznik' ? -1 : 0)).map(red).join('') : '<p class="pod" style="margin:0">Za ovaj dan nema ništa zakazano.</p>'}</div>

  document.getElementById('kalNazad').onclick = () => { haptika(); kalMesec = new Date(g, m - 1, 1); planKalendar(); };
  document.getElementById('kalNapred').onclick = () => { haptika(); kalMesec = new Date(g, m + 1, 1); planKalendar(); };
  document.querySelectorAll('[data-kdan]').forEach(b => b.onclick = () => { haptika(); kalDan = b.dataset.kdan; planKalendar(); });
  document.querySelectorAll('[data-praznik]').forEach(b => b.onclick = () => { const p = pr.find(x => x.k === b.dataset.praznik); if (p) napraviZaPraznik(p); });

function ucitajSliku(f) {

function nacrtajPreIPosle(platno, pre, posle, raspored) {

  const poz = /^#[0-9a-f]{6}$/i.test(b.pozadina || '') ? b.pozadina : '#23281A', ak = /^#[0-9a-f]{6}$/i.test(b.akcenat || '') ? b.akcenat : '#D9A63A';

  const lr = raspored === 'lr', deb = 8;
  const delovi = lr ? [[0, 0, W / 2 - deb / 2, H], [W / 2 + deb / 2, 0, W / 2 - deb / 2, H]] : [[0, 0, W, H / 2 - deb / 2], [0, H / 2 + deb / 2, W, H / 2 - deb / 2]];
  [pre, posle].forEach((img, i) => { if (img) pokrij(img, ...delovi[i]); });
  c.fillStyle = ak; if (lr) c.fillRect(W / 2 - deb / 2, 0, deb, H); else c.fillRect(0, H / 2 - deb / 2, W, deb);

    c.globalAlpha = .9; c.fillStyle = poz; c.beginPath(); if (c.roundRect) c.roundRect(x, y - h, w, h, 32); else c.rect(x, y - h, w, h); c.fill(); c.globalAlpha = 1;

  if (p.akcija === 'red') { await cekaj(600); return { ok: true, poruka: p.nacin === 'otkazi' ? 'U redu, ova objava neće biti objavljena.' : 'Zakazano (u primeru se ništa ne menja).' }; }
  if (p.akcija === 'slike') { await cekaj(600); return { ok: true, slike: JSON.parse(p.zadrzi || '[]') }; }
  if (p.akcija === 'odmah') { await cekaj(700); return { ok: true, poruka: 'U primeru se ništa ne objavljuje na Instagramu.' }; }
  await cekaj(['objava', 'grafika'].includes(p.akcija) ? 1800 : 900);
  const d = podaci;
  if (p.akcija === 'grafika') {
    const o = { id: Date.now(), tip: 'post_kartica', slika: sl('#3E4A20', '#6B7C3C'), slike: [], slika_broj: 1, caption: p.napomena.charAt(0).toUpperCase() + p.napomena.slice(1) + (jeHrana() ? ' 🔥\nSačuvajte objavu za sledeću porudžbinu.\n\nPoručite u DM ili svratite.\n\n#piletina #fastfood' : ' ✨\nSačuvajte objavu da vam bude pri ruci, a za sva pitanja smo tu.\n\nZakažite termin porukom u DM.\n\n#salon #beograd'), status: 'ceka_odobrenje' };
    o.slike = [o.slika]; d.ceka.unshift(o); d.brojke.ceka++; return { ok: true, objava: o, termin: 'u ' + (d.plan.find(t => !t.objava) || { dan: 'sledećem terminu' }).dan + ' u 19h' };
  }
  if (p.akcija === 'objava') {
    const slike = JSON.parse(p.slike).map(b => 'data:image/jpeg;base64,' + b);
    const o = { id: Date.now(), tip: 'post', slika: slike[0], slike, slika_broj: slike.length, caption: jeHrana() ? (p.napomena ? p.napomena.charAt(0).toUpperCase() + p.napomena.slice(1) + ' 🔥' : 'Sveže iz naše kuhinje 🔥') + '\nHrskavo spolja, sočno unutra, pravi se tek kad poručite.\n\nPoručite u DM ili svratite do nas 🛵\n\n#piletina #fastfood' : (p.napomena ? 'Rezultat koji se vidi: ' + p.napomena + ' ✨' : 'Novi rad iz našeg salona ✨') + '\nSvaki detalj je urađen sa pažnjom, da kosa izgleda negovano i posle nekoliko nedelja.\n\nZakažite termin porukom u DM.\n\n#frizer #beograd', status: 'ceka_odobrenje' };
    d.ceka.unshift(o); d.brojke.ceka++; return { ok: true, objava: o, termin: 'u ' + (d.plan.find(t => !t.objava) || { dan: 'sledećem terminu' }).dan + ' u 19h' };
  }
  if (p.akcija === 'story') { const o = { id: Date.now(), tip: 'story_tekst', slika: sl('#2B2B2B', '#4A3B36'), slike: [], caption: p.tekst, status: 'ceka_odobrenje' }; o.slike = [o.slika]; d.ceka.unshift(o); d.brojke.ceka++; return { ok: true, objava: o }; }
  const i = d.ceka.findIndex(o => String(o.id) === String(p.red_id)); const o = d.ceka[i];
  if (['kr', 'op', 'dt', 'tx'].includes(p.akcija)) return { ok: true, caption: ({ kr: 'Kraća verzija: ', op: 'Opuštenije: ', dt: 'Nova verzija: ', tx: 'Po vašoj želji: ' })[p.akcija] + prvaRecenica(o.caption) + (jeHrana() ? '\n\nPoručite u DM ili svratite.' : '\n\nZakažite termin porukom u DM.') };
  d.ceka.splice(i, 1); d.brojke.ceka--;
  if (p.akcija === 'ok') { if (o.tip === 'story_tekst') { d.brojke.story++; return { ok: true, poruka: 'Story je objavljen na Instagramu.' }; } const t = d.plan.find(x => !x.objava); if (t) t.objava = o; d.brojke.spremno++; return { ok: true, poruka: 'Odobreno! Izlazi ' + (t ? t.dan + ' u ' + t.sat : 'u sledećem terminu') + '.' }; }
  return { ok: true, poruka: 'U redu, ova objava neće biti objavljena.' };
}
