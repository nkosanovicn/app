<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Razvitak</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Razvitak: Instagram vašeg salona na jednom mestu.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="ikona-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Razvitak">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --pozadina:#FFFFFF; --povrsina:#FFFFFF; --mastilo:#1E211A; --tiho:#6B6E66; --linija:#E8E9E4; --tiho-poz:#F5F6F2;
  --orhideja:#5F7033; --orhideja-svetla:#EFF2E6; --rumenilo:#F6EFDD; --zlato:#D9A63A; --menta:#2F8F6B; --cilibar:#B26E00; --cilibar-svetli:#FCF0DC;
  --na-orhideji:#FFFFFF; --radius-veliki:22px; --radius:14px; --radius-mali:9px;
  --display:"Fredoka", system-ui, sans-serif; --telo:"Figtree", system-ui, sans-serif;
}
:root.tamno{
  --pozadina:#111210; --povrsina:#191A17; --mastilo:#ECEDE8; --tiho:#9C9F95; --linija:#2C2E29; --tiho-poz:#1F201C;
  --orhideja:#B8CB7C; --orhideja-svetla:#262A1F; --rumenilo:#3A3220; --zlato:#E2B451; --menta:#6CCFA4; --cilibar:#F0B451; --cilibar-svetli:#3D2F1A; --na-orhideji:#151A0C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--pozadina);color:var(--mastilo);font-family:var(--telo);font-size:16px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--orhideja);outline-offset:2px}
img{display:block;max-width:100%}
.omot{max-width:560px;margin:0 auto;padding:18px 18px 0}

/* zaglavlje */
.zaglavlje{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.znak{display:flex;align-items:center;gap:10px}
.znak svg{width:34px;height:38px}
.znak b{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.01em;color:var(--mastilo)}
.salon-izbor{appearance:none;background:var(--povrsina);border:1px solid var(--linija);border-radius:999px;padding:8px 32px 8px 14px;font:500 14px var(--telo);color:var(--mastilo);max-width:200px;
  background-image:linear-gradient(45deg,transparent 50%,var(--tiho) 50%),linear-gradient(135deg,var(--tiho) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.salon-dugme{display:inline-flex;align-items:center;gap:6px;background:var(--povrsina);border:1px solid var(--linija);border-radius:999px;padding:8px 10px 8px 12px;font:500 14px var(--telo);color:var(--mastilo);max-width:150px}
.salon-dugme span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.salon-dugme svg{width:14px;height:14px;flex:none;stroke:var(--tiho)}
.saloni{display:grid;gap:14px;margin-top:22px}
.salon-kartica{background:var(--povrsina);border:1px solid var(--linija);border-radius:var(--radius);overflow:hidden}
.salon-kartica.trenutni{box-shadow:inset 3px 0 0 var(--orhideja)}
.salon-glava{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 16px 6px}
.salon-glava h3{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.salon-glava p{font-size:13px;color:var(--tiho);margin-top:3px}
.salon-glava p .upozorenje{color:#B4532A;font-weight:600}
.salon-glava .oznaka{font-size:12px;font-weight:600;color:var(--orhideja);background:var(--orhideja-svetla);border-radius:999px;padding:4px 10px;flex:none}
.salon-glava svg{width:18px;height:18px;stroke:var(--tiho);flex:none}
.salon-brojke{display:grid;grid-template-columns:repeat(3,1fr);padding:10px 16px 12px;gap:8px}
.salon-brojke div{display:flex;flex-direction:column}
.salon-brojke b{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.salon-brojke b small{font-size:14px;color:var(--tiho);font-weight:500}
.salon-brojke span{font-size:13px;color:var(--tiho)}
.salon-brojke .vazno b{color:var(--orhideja)}
.salon-radnje{display:flex;gap:8px;padding:0 16px 16px}
.salon-radnje .cip{flex:1;justify-content:center;display:inline-flex;font-weight:600}
.salon-ime{font-size:14px;color:var(--tiho);text-align:right;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tipografija */
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.08;letter-spacing:-.025em}
h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.015em;margin:30px 0 12px}
.pod{color:var(--tiho);font-size:15px;margin-top:6px}

/* sledeca objava: list iz knjige zakazivanja */
.listic{margin-top:22px;display:grid;grid-template-columns:86px 1fr;background:var(--povrsina);border-radius:var(--radius-veliki);overflow:hidden;border:1px solid var(--linija);box-shadow:0 16px 36px -30px rgba(30,33,26,.35)}
.listic .vreme{background:var(--tiho-poz);color:var(--mastilo);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 6px;position:relative}
.listic .vreme::after{content:"";position:absolute;right:-7px;top:0;bottom:0;width:14px;background:radial-gradient(circle at 7px 9px,var(--povrsina) 4px,transparent 4.5px) 0 0/14px 18px repeat-y}
.listic .dan{font-size:13px;color:var(--tiho);text-transform:lowercase}
.listic .sat{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;color:var(--orhideja)}
.listic .sadrzaj{display:flex;gap:14px;align-items:center;padding:14px 16px 14px 20px;min-height:110px}
.listic .sadrzaj img,.slicica{width:72px;height:90px;border-radius:var(--radius-mali);object-fit:cover;flex:none;background:var(--rumenilo)}
.listic .naslov{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.listic .napomena{font-size:13px;color:var(--tiho);margin-top:4px}
.listic.prazan .sadrzaj{color:var(--tiho)}

/* mesecni ucinak: zupci cesljа */
.mesec{margin-top:26px}
.mesec .red{display:flex;justify-content:space-between;align-items:baseline}
.mesec .broj{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.mesec .broj small{font-size:16px;color:var(--tiho);font-weight:500}
.zupci{display:flex;gap:4px;margin-top:10px;height:34px;align-items:flex-end}
.zupci i{flex:1;max-width:22px;height:100%;border-radius:4px 4px 2px 2px;background:var(--linija)}
.zupci i.pun{background:var(--orhideja)}
.dodatno{display:grid;gap:14px;margin-top:4px}
.dodatno div{display:grid;grid-template-columns:64px 1fr 60px;align-items:center;gap:12px;font-size:15px}
.dodatno span{color:var(--tiho)}
.dodatno .mini{height:8px;border-radius:99px;background:var(--linija);overflow:hidden}
.dodatno .mini i{display:block;height:100%;background:var(--orhideja);border-radius:99px}
.dodatno b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.dodatno b small{color:var(--tiho);font-weight:500;font-size:14px}
img.pala{object-fit:contain!important;background:var(--orhideja-svetla)}
.mikrofon-red{display:flex;align-items:center;gap:10px;margin-top:10px}
.mikrofon-red small{color:var(--tiho);font-size:13px}
.cip.mik{display:inline-flex;align-items:center;gap:7px;color:var(--orhideja);border-color:var(--orhideja-svetla);font-weight:600}
.cip.mik svg{width:17px;height:17px;stroke:currentColor}
.cip.mik.snima{background:var(--orhideja);color:var(--na-orhideji);border-color:var(--orhideja)}
.cip.mik.snima::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:puls 1s ease-in-out infinite}
@keyframes puls{50%{opacity:.25}}
.zupci i.pun:nth-child(odd){height:86%}
.zupci i:not(.pun):nth-child(odd){height:86%}

/* ceka odobrenje */
.ceka{margin-top:24px;background:var(--cilibar-svetli);border-radius:var(--radius);padding:14px 16px;display:flex;gap:14px;align-items:center}
.ceka .slike{display:flex}
.ceka .slike img,.ceka .slike span{width:40px;height:50px;border-radius:7px;object-fit:cover;border:2px solid var(--cilibar-svetli);margin-left:-12px;background:var(--rumenilo)}
.ceka .slike :first-child{margin-left:0}
.ceka p{font-size:14px;flex:1}
.ceka strong{color:var(--cilibar);display:block;font-size:15px}

/* brze radnje */
.radnje{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.radnja{background:var(--povrsina);border:1px solid var(--linija);border-radius:var(--radius);padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px}
.radnja svg{width:28px;height:28px;stroke:var(--orhideja)}
.radnja:active{transform:scale(.97)}

/* plan */
.dan-blok{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--linija)}
.dan-blok:last-child{border-bottom:0}
.dan-oznaka{font-size:13px;color:var(--tiho);line-height:1.25;padding-top:4px}
.dan-oznaka b{display:block;font-family:var(--display);font-size:22px;color:var(--mastilo);font-weight:700}
.termin{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.termin:last-child{margin-bottom:0}
.termin .sat-cip{font-family:var(--display);font-weight:700;font-size:15px;min-width:42px}
.termin .zauzet{flex:1;text-align:left;display:flex;gap:10px;align-items:center;background:var(--povrsina);border-radius:var(--radius-mali);padding:6px;box-shadow:0 1px 0 var(--linija)}
.termin .zauzet img,.termin .zauzet .ikona-reels{width:40px;height:50px;border-radius:7px;object-fit:cover;background:var(--rumenilo);flex:none;display:grid;place-items:center}
.termin .zauzet span{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.termin .slobodan{flex:1;border:1.5px dashed var(--linija);border-radius:var(--radius-mali);padding:14px 12px;font-size:14px;color:var(--tiho)}

/* objave */
.mreza{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:var(--radius);overflow:hidden}
.mreza button{position:relative;aspect-ratio:4/5;background:var(--rumenilo)}
.mreza img{width:100%;height:100%;object-fit:cover}
.mreza .oznaka{position:absolute;top:6px;right:6px;background:rgba(18,22,10,.6);color:#fff;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px}

/* brojke */
.pratioci{display:flex;align-items:baseline;gap:10px}
.pratioci .veliki{font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:-.04em;line-height:.95}
.metrike{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linija);border-radius:var(--radius);overflow:hidden;margin-top:18px}
.metrike div{background:var(--povrsina);padding:14px 12px}
.metrike b{display:block;font-family:var(--display);font-size:24px;font-weight:700}
.metrike span{font-size:13px;color:var(--tiho)}
.grafikon{background:var(--povrsina);border-radius:var(--radius);padding:16px 14px 10px}
.grafikon svg{width:100%;height:120px;display:block}
.grafikon .ose{display:flex;justify-content:space-between;font-size:12px;color:var(--tiho);margin-top:6px}
.trake div{display:grid;grid-template-columns:88px 1fr 34px;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
.trake .traka{height:10px;border-radius:5px;background:var(--linija);overflow:hidden}
.trake .traka i{display:block;height:100%;background:var(--orhideja);border-radius:5px}
.trake em{font-style:normal;color:var(--tiho);text-align:right;font-size:13px}

/* donja traka */
nav.dno{position:fixed;left:0;right:0;bottom:0;background:var(--povrsina);border-top:1px solid var(--linija);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.dno button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--tiho);padding:4px 0}
nav.dno svg{width:24px;height:24px;stroke:currentColor}
nav.dno button[aria-current="page"]{color:var(--orhideja);font-weight:600}

/* donji panel */
.zavesa{position:fixed;inset:0;background:rgba(18,22,10,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.zavesa.otvorena{opacity:1;pointer-events:auto}
.panel{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--povrsina);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;z-index:11;max-width:560px;margin:0 auto}
.panel.otvoren{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.panel .rucka{width:44px;height:5px;border-radius:3px;background:var(--linija);margin:0 auto 16px;cursor:grab;box-shadow:0 0 0 14px transparent;position:relative}
.panel .rucka::before{content:"";position:absolute;inset:-14px -40px}
.panel h3{font-family:var(--display);font-size:22px;font-weight:700;margin-bottom:8px}
.panel p{color:var(--tiho);margin-bottom:12px}
.panel ol{margin:0 0 18px 20px;display:grid;gap:8px}
.panel .velika-slika{width:100%;border-radius:var(--radius);margin-bottom:14px;max-height:52vh;object-fit:cover;background:var(--rumenilo)}
.panel .opis{white-space:pre-wrap;color:var(--mastilo);font-size:15px}
.dugme{display:block;width:100%;background:var(--orhideja);color:var(--na-orhideji);border-radius:var(--radius);padding:15px;font-weight:600;font-size:16px;text-align:center}
.dugme.drugo{background:var(--orhideja-svetla);color:var(--orhideja);margin-top:8px}

/* stanja */
.prazno{text-align:center;color:var(--tiho);padding:40px 10px}
.traka-primer{background:var(--tiho-poz);color:var(--tiho);border:1px solid var(--linija);font-size:13px;border-radius:var(--radius-mali);padding:8px 12px;margin-bottom:16px}
.ucitavanje .kost{background:linear-gradient(90deg,var(--linija),var(--povrsina),var(--linija));background-size:200% 100%;animation:sija 1.2s infinite;border-radius:var(--radius)}
@keyframes sija{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* pregled i radnje */
.galerija{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px 14px;padding:0 20px}
.galerija img{flex:none;width:78%;max-height:42vh;object-fit:cover;border-radius:var(--radius);scroll-snap-align:center;background:var(--rumenilo)}
.galerija img:only-child{width:100%}
.galerija.uspravno img{object-fit:contain;background:var(--mastilo)}
.dugmad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.dugme.ne{background:var(--povrsina);color:var(--mastilo);border:1px solid var(--linija)}
.cipovi{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cip{border:1px solid var(--linija);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;background:var(--povrsina)}
.dugme[disabled],.cip[disabled]{opacity:.55}
.lista-ceka button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--linija)}
.lista-ceka button:last-child{border-bottom:0}
.lista-ceka img,.lista-ceka .ikona-reels{width:52px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--rumenilo);display:grid;place-items:center}
.lista-ceka span{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
textarea.polje,input.polje{width:100%;min-height:96px;border:1px solid var(--linija);border-radius:var(--radius);padding:12px;font:inherit;color:var(--mastilo);background:var(--pozadina);resize:vertical}
textarea.polje:focus-visible,input.polje:focus-visible{outline:2px solid var(--orhideja);outline-offset:1px}
.biraj{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed #C3C8B4;border-radius:var(--radius);padding:22px;color:var(--orhideja);font-weight:600;text-align:center;cursor:pointer;margin-bottom:12px}
.biraj small{color:var(--tiho);font-weight:400}
.izabrane{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.izabrane img{width:62px;height:76px;object-fit:cover;border-radius:8px}
.radi{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;text-align:center;color:var(--tiho)}
.radi i{width:42px;height:42px;border-radius:50%;border:3px solid var(--orhideja-svetla);border-top-color:var(--orhideja);animation:vrti .9s linear infinite}
@keyframes vrti{to{transform:rotate(360deg)}}
.tost{pointer-events:none;position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--mastilo);color:var(--pozadina);padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:all .25s;z-index:20;max-width:90vw;text-align:center}
.tost.vidljiv{opacity:1;transform:translate(-50%,0)}
.ceka{cursor:pointer;width:100%;text-align:left}
[hidden]{display:none!important}
body.bez-menija nav.dno{display:none}
body.bez-menija{padding-bottom:24px}
.prijava{padding:34px 4px 10px}
.prijava .velik-znak{width:64px;height:64px;margin-bottom:26px}
.prijava h1{font-size:34px}
.prijava .pod{font-size:16px;margin:12px 0 28px;max-width:34ch}
.prijava .dugme + .dugme{margin-top:10px}
.prijava a.dugme{text-decoration:none}
.koraci{list-style:none;display:grid;gap:14px;margin:6px 0 26px;counter-reset:k}
.koraci li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;counter-increment:k}
.koraci li::before{content:counter(k);width:30px;height:30px;border-radius:50%;background:var(--orhideja-svetla);color:var(--orhideja);font-weight:700;display:grid;place-items:center;font-size:14px}
.koraci li.gotov::before{content:"✓";background:var(--orhideja);color:var(--na-orhideji)}
.cekam{display:flex;align-items:center;gap:10px;color:var(--tiho);font-size:15px;margin-top:18px}
.cekam i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--orhideja-svetla);border-top-color:var(--orhideja);animation:vrti .9s linear infinite;flex:none}
.savet{margin-top:26px;padding:14px 16px;border-radius:var(--radius);background:var(--povrsina);border:1px solid var(--linija);font-size:14px;color:var(--tiho)}
.savet button{color:var(--orhideja);font-weight:600;font-size:14px;padding:0;margin-top:4px}
.tekst-dugme{color:var(--tiho);font-size:14px;padding:10px 0;text-decoration:underline;text-underline-offset:3px}
.desno{display:flex;align-items:center;gap:8px;min-width:0}
.ikonica-dugme{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--linija);background:var(--povrsina)}
.ikonica-dugme svg{width:19px;height:19px;stroke:var(--tiho)}
body.bez-menija .ikonica-dugme{display:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--tiho-poz);border:1px solid var(--linija);border-radius:12px;padding:3px}
.seg button{padding:9px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--tiho)}
.seg button[aria-pressed="true"]{background:var(--povrsina);color:var(--mastilo);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.post-grupa{margin-top:24px}
.post-grupa h4{font-size:14px;font-weight:600;color:var(--tiho);margin-bottom:8px}
.post-red{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--linija);font-size:15px}
.post-red span:last-child{font-weight:600;text-align:right}
.post-link{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 0;border-bottom:1px solid var(--linija);font-size:15px;font-weight:500;color:var(--mastilo);text-decoration:none;text-align:left}
.post-link::after{content:"›";color:var(--tiho);font-size:20px;line-height:1}
.dugme.opasno{background:transparent;color:#B4532A;border:1px solid var(--linija);margin-top:14px}
.post-napomena{font-size:13px;color:var(--tiho);margin-top:8px}
.dani{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dani button{padding:10px 0;border-radius:10px;border:1px solid var(--linija);font-size:13px;font-weight:600;color:var(--tiho);background:var(--povrsina)}
.dani button[aria-pressed="true"]{background:var(--orhideja);border-color:var(--orhideja);color:var(--na-orhideji)}
.post-grupa .dugme{margin-top:12px}
.naziv-red{display:flex;gap:8px;align-items:stretch}
.naziv-red .polje{flex:1;min-width:0;min-height:0;height:46px;padding:10px 12px;resize:none}
.naziv-red .cip{flex:none;padding:0 16px;font-weight:600}
.ig-nalog{display:flex;align-items:center;gap:12px;padding:4px 0}
.ig-slika{width:48px;height:48px;border-radius:50%;flex:none;object-fit:cover;background:var(--tiho-poz);border:1px solid var(--linija);display:block}
.ig-nalog b{display:block;font-size:15px}
.ig-nalog a{font-size:14px;color:var(--tiho);text-decoration:none}
.ig-nalog small{display:block;font-size:13px;color:var(--tiho);margin-top:2px}
.ig-nalog small.upozorenje{color:#B4532A;font-weight:600}
.post-verzija{font-size:12px;color:var(--tiho);text-align:center;margin-top:26px}
.podnozje{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:22px;padding-top:12px;border-top:1px solid var(--linija)}
.traka-primer button{color:inherit;font-weight:700;font-size:inherit;text-decoration:underline;padding:0}
</style>
</head>
<body>

      <svg aria-hidden="true" viewBox="150 125 212 238"><path d="M256.0 214.0 L214.0 160.0" stroke="#D9A63A" stroke-width="11.0" stroke-linecap="round" fill="none"/>

<path d="M290.0 146.0 L322.0 138.0 L316.0 170.0" stroke="#D9A63A" stroke-width="11.0" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  </header>
  <div id="primer" class="traka-primer" hidden>Primer prikaza sa izmišljenim podacima. Pravi podaci se vide kad se aplikacija otvori iz Telegrama.</div>

<div class="zavesa" id="zavesa"></div>

<script>
/* automatsko ažuriranje: ako na serveru postoji novija verzija, stranica se sama učita ponovo */
const VERZIJA = '2026-11-14.8';
async function proveriVerziju() {
  try {
    const odg = await fetch('verzija.json?t=' + Date.now(), { cache: 'no-store' });
    const v = (await odg.json()).verzija;
    if (!v || v === VERZIJA) return;
    const q = new URLSearchParams(location.search);
    if (q.get('v') === v) return; // već smo probali, ne vrti u krug
    q.set('v', v); location.replace(location.pathname + '?' + q.toString() + location.hash);
  } catch (e) {}
}
proveriVerziju();
document.addEventListener('visibilitychange', () => { if (!document.hidden) proveriVerziju(); });
const API = 'https://miroslavmiki.app.n8n.cloud/webhook/blade-app-api';
const tg = window.Telegram && window.Telegram.WebApp;
const uTelegramu = !!(tg && tg.initData);
const BOT = 'kaodajebitno_bot';
const API_PRIJAVA = 'https://miroslavmiki.app.n8n.cloud/webhook/blade-app-prijava';
const uOkviru = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const samostalno = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const iPhone = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const skladiste = {
  uzmi: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  stavi: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
};
let token = uTelegramu ? '' : skladiste.uzmi('blade_token');
let demo = !uTelegramu && (uOkviru || new URLSearchParams(location.search).has('demo'));
let podaci = null, tab = (() => { try { return sessionStorage.getItem('razvitak_tab') || 'pocetna'; } catch (e) { return 'pocetna'; } })(), kodIzbor = '';
const pravo = () => uTelegramu || (!!token && !demo);
const prijava = () => uTelegramu ? { initData: tg.initData } : { token };
/* pamćenje poslednjih podataka u telefonu: otvaranje je trenutno, pa se tiho osveži */
const kljucKes = () => 'blade_kes_' + (uTelegramu ? String((tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 'tg') : token.slice(0, 16));
function sacuvajKes() { if (!pravo() || !podaci || !podaci.salon) return; try { localStorage.setItem(kljucKes(), JSON.stringify({ kod: podaci.salon.kod, t: Date.now(), p: podaci })); } catch (e) {} }
function uzmiKes() {
  try { const k = JSON.parse(localStorage.getItem(kljucKes()) || 'null'); const zeljeni = kodIzbor || skladiste.uzmi('blade_salon');
    if (!k || (zeljeni && k.kod !== zeljeni) || Date.now() - k.t > 14 * 864e5) return null; return k.p; } catch (e) { return null; }
}
function obrisiKes() { try { Object.keys(localStorage).filter(k => k.startsWith('blade_kes_')).forEach(k => localStorage.removeItem(k)); } catch (e) {} }
let statVreme = 0;
function primi(j) {
  const isti = podaci && podaci.salon && j.salon && podaci.salon.kod === j.salon.kod;
  const stat = isti ? podaci.stat : undefined;
  podaci = j;
  if (stat === undefined) { delete podaci.stat; statVreme = 0; } else podaci.stat = stat;
  sacuvajKes();
}
async function ucitajStat() {
  if (!pravo() || !podaci || Date.now() - statVreme < 5 * 60 * 1000) return;
  statVreme = Date.now(); const kod = podaci.salon.kod;
  try {
    const odg = await fetch(API, { method: 'POST', body: new URLSearchParams({ ...prijava(), kod, deo: 'stat' }) });
    if (odg.status === 401 && !uTelegramu) return istekla();
    const j = await odg.json(); if (!j.ok) throw new Error();
    if (!podaci || podaci.salon.kod !== kod) return;
    podaci.stat = j.stat; sacuvajKes();
    if (tab === 'brojke') brojke();
  } catch (e) { statVreme = 0; if (tab === 'brojke' && podaci && podaci.stat === undefined) ekran(`<h1>Brojke</h1><div class="prazno"><p>Statistika se nije učitala.</p><button class="dugme" style="margin-top:18px" onclick="brojke()">Pokušaj ponovo</button></div>`); }
}
function istekla() { obrisiKes(); token = ''; skladiste.stavi('blade_token', ''); podaci = null; ekranPrijave('Prijava je istekla ili ste se odjavili. Prijavite se ponovo.'); }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prvaRecenica = t => { const r = String(t || '').split('\n').map(x => x.trim()).filter(x => x && !x.startsWith('#'))[0] || ''; return r.length > 110 ? r.slice(0, 107) + '…' : r; };
const bezHashtagova = t => String(t || '').split('\n').filter(l => !/^(#\S+\s*)+$/.test(l.trim())).join('\n').trim();
const broj = n => n == null ? '–' : Number(n).toLocaleString('sr-Latn');
const haptika = v => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(v || 'light'); } catch (e) {} };
const datum = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('sr-Latn', { day: 'numeric', month: 'long' }); };
/* slike sa ImgBB-a idu preko wsrv.nl (brže, smanjene, i rade i kad je ImgBB nedostupan); ako proxy ne uspe, probaj original */
const sl_url = (u, w) => (/^https?:\/\//.test(String(u || '')) ? 'https://wsrv.nl/?url=' + encodeURIComponent(String(u).replace(/^https?:\/\//, '')) + '&w=' + (w || 900) + '&we&output=webp&q=82' : String(u || ''));
const sl_atr = (u, w) => `src="${esc(sl_url(u, w))}" data-original="${esc(u)}"`;
const slika = (o, klasa) => o && o.slika ? `<img class="${klasa || ''}" ${sl_atr(o.slika, 500)} alt="" loading="lazy">` : `<span class="${klasa || ''} ikona-reels" aria-hidden="true">${o && o.tip === 'reel' ? '🎬' : ''}</span>`;

/* tema: kao telefon (Telegram), svetla ili tamna; izbor se pamti na uređaju */
const temaIzbor = () => { try { return localStorage.getItem('razvitak_tema') || 'auto'; } catch (e) { return 'auto'; } };
function primeniTemu() {
  const izbor = temaIzbor();
  const sistemTamno = uTelegramu ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const tamno = izbor === 'tamna' || (izbor === 'auto' && sistemTamno);
  document.documentElement.classList.toggle('tamno', tamno);
  const boja = getComputedStyle(document.documentElement).getPropertyValue('--pozadina').trim();
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', boja);
  if (uTelegramu) { try { tg.setHeaderColor && tg.setHeaderColor(boja); tg.setBackgroundColor && tg.setBackgroundColor(boja); } catch (e) {} }
}
if (uTelegramu) { try { tg.ready(); tg.expand(); tg.onEvent && tg.onEvent('themeChanged', primeniTemu); } catch (e) {} }
else { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', primeniTemu); } catch (e) {} }
primeniTemu();

async function ucitaj() {
  if (!uTelegramu && demo) return prikaziPrimer();
  if (!pravo()) return ekranPrijave();
  document.body.classList.remove('bez-menija');
  const kes = !podaci && uzmiKes();
  if (kes) { podaci = kes; prikazi(); }
  try {
    const odg = await fetch(API, { method: 'POST', body: new URLSearchParams({ ...prijava(), kod: kodIzbor || skladiste.uzmi('blade_salon') }) });
    if (odg.status === 401 && !uTelegramu) return istekla();
    const j = await odg.json();
    if (j.nepovezan) return ekran(`<div class="prazno"><h1>Još niste povezani</h1><p class="pod">Ovaj Telegram nalog još nije povezan sa salonom. Otvorite link koji ste dobili od nas i pritisnite Start, pa ponovo otvorite aplikaciju.</p>${uTelegramu ? '' : '<button class="tekst-dugme" onclick="odjava()">Prijavi se drugim nalogom</button>'}</div>`);
    if (!j.ok) return ekran(`<div class="prazno"><h1>Aplikacija se nije učitala</h1><p class="pod">${uTelegramu ? 'Zatvorite je i otvorite ponovo iz chata.' : 'Osvežite stranicu.'} Ako se ponovi, pišite nam u chatu.</p></div>`);
    primi(j); prikazi(!!kes);
  } catch (e) {
    if (kes) return tost('Nema interneta. Prikazujem poslednje podatke.');
    ekran(`<div class="prazno"><h1>Nema veze sa serverom</h1><p class="pod">Proverite internet i pokušajte ponovo.</p><button class="dugme" style="margin-top:18px" onclick="ucitaj()">Pokušaj ponovo</button></div>`);
  }
}
const PALA_SLIKA = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><g fill="none" stroke="#8C9A66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="24" height="20" rx="3"/><circle cx="20" cy="21" r="2.2"/><path d="M14 31l7-7 5 5 3-3 5 5"/></g></svg>');
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.dataset.original && !t.dataset.probao) { t.dataset.probao = '1'; t.src = t.dataset.original; return; } if (t && t.tagName === 'IMG' && !t.dataset.pala) { t.dataset.pala = '1'; t.classList.add('pala'); t.alt = 'Slika nije dostupna'; t.src = PALA_SLIKA; } }, true);
function ekran(html) { document.getElementById('ekran').innerHTML = html; }

function zaglavlje() {
  const m = document.getElementById('salonMesto');
  if (podaci.admin && podaci.saloni && podaci.saloni.length) {
    m.innerHTML = `<button class="salon-dugme" aria-label="Promeni salon"><span>${esc(podaci.salon.naziv)}</span><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg></button>`;
    m.querySelector('button').onclick = () => { haptika(); tab = 'saloni'; prikazi(); };
  } else m.innerHTML = `<div class="salon-ime">${esc(podaci.salon.naziv)}</div>`;
}

function prikazi(bezSkrola) {
  zaglavlje();
  document.querySelector('nav.dno [data-tab="saloni"]').hidden = !podaci.admin;
  if (tab === 'saloni' && !podaci.admin) tab = 'pocetna';
  document.querySelectorAll('nav.dno button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  if (!['pocetna', 'plan', 'objave', 'brojke', 'saloni'].includes(tab)) tab = 'pocetna';
  try { sessionStorage.setItem('razvitak_tab', tab); } catch (e) {}
  ({ pocetna, plan, objave, brojke, saloni: saloniEkran })[tab]();
  if (!bezSkrola) window.scrollTo(0, 0);
}

const objava = n => n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'objave' : 'objava';
/* ---------- podešavanja ---------- */
function postavke() {
  haptika();
  const s = podaci && podaci.salon, l = (s && s.limiti) || {};
  let rDani = s && Array.isArray(s.dani) && s.dani.length ? s.dani.map(Number) : [1, 2, 3, 4, 5, 6, 7];
  let rSat = s && s.sat ? String(s.sat) : 'oba';
  const pocetno = rDani.join(',') + '|' + rSat;
  const iz = temaIzbor();
  const seg = (k, t) => `<button data-tema="${k}" aria-pressed="${iz === k}">${t}</button>`;
  const paket = s ? `<div class="post-grupa"><h4>Vaš paket</h4>
      <div class="post-red"><span>Paket</span><span>${esc(s.paket || '')}</span></div>
      <div class="post-red"><span>Objave mesečno</span><span>${Number(l.objave || s.limit) || 'po dogovoru'}</span></div>
      ${Number(l.reels) ? `<div class="post-red"><span>Reels mesečno</span><span>${l.reels}</span></div>` : ''}
      ${Number(l.story) ? `<div class="post-red"><span>Dodatni Story mesečno</span><span>${l.story}</span></div>` : ''}
      <p class="post-napomena">Za promenu paketa pišite nam u chat.</p></div>
    <div class="post-grupa"><h4>Raspored objava</h4>
      <div class="dani" role="group" aria-label="Dani objava">${['Pon', 'Uto', 'Sre', 'Čet', 'Pet', 'Sub', 'Ned'].map((d, i) => `<button data-dan="${i + 1}" aria-pressed="${rDani.includes(i + 1)}">${d}</button>`).join('')}</div>
      <div class="seg" role="group" aria-label="Vreme objava" style="margin-top:10px">${[['10', 'u 10h'], ['19', 'u 19h'], ['oba', '10h i 19h']].map(([k, t]) => `<button data-sat="${k}" aria-pressed="${rSat === k}">${t}</button>`).join('')}</div>
      <p class="post-napomena" id="rasporedInfo"></p>
      <button class="dugme" id="sacuvajRaspored" disabled>Sačuvaj raspored</button></div>` : '';
  const nalog = uTelegramu ? '' : (demo || !token
    ? `<div class="post-grupa"><h4>Nalog</h4><button class="dugme" id="postPrijava">Prijavite se</button></div>`
    : `<div class="post-grupa"><h4>Nalog</h4>${podaci && podaci.ime ? `<div class="post-red"><span>Prijavljeni ste kao</span><span>${esc(podaci.ime)}</span></div>` : ''}
        <button class="dugme opasno" id="postOdjava">Odjavi se sa ovog uređaja</button>
        <p class="post-napomena">Za odjavu sa svih uređaja odjednom pošaljite botu reč „odjava“.</p></div>`);
  otvoriPanel(`<h3>Podešavanja</h3>

/* ---------- glasovna poruka: snimi u telefonu, AI prepiše u tekst ---------- */
const MIK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>';
const uBase64 = blob => new Promise((ok, ne) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = ne; r.readAsDataURL(blob); });
function mikrofon(poljeId, dugmeId, primerTekst) {
  const d = document.getElementById(dugmeId), polje = document.getElementById(poljeId);
  const vrati = () => { d.disabled = false; d.classList.remove('snima'); d.innerHTML = MIK + 'Izgovorite'; };
  const upisi = t => { polje.value = (polje.value.trim() ? polje.value.trim() + ' ' : '') + t; polje.dispatchEvent(new Event('input')); };
  vrati();
  let rec = null, tajmer = null, pocetak = 0;
  d.onclick = async () => {
    haptika();
    if (rec && rec.state === 'recording') { rec.stop(); return; }
    if (!pravo()) { d.disabled = true; d.innerHTML = 'Prepisujem…'; await cekaj(1200); upisi(primerTekst); return vrati(); }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return tost(uTelegramu ? 'Ovde mikrofon ne radi. Pošaljite glasovnu poruku u chat.' : 'Ovaj pregledač ne podržava snimanje.');
    let tok;
    try { tok = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { return tost(uTelegramu ? 'Telegram nije dozvolio mikrofon. Pošaljite glasovnu poruku u chat.' : 'Dozvolite mikrofon za ovu stranicu u podešavanjima pregledača.'); }
    const tip = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    const delovi = [];
    try { rec = new MediaRecorder(tok, tip ? { mimeType: tip } : undefined); } catch (e) { tok.getTracks().forEach(t => t.stop()); return tost('Snimanje nije uspelo.'); }
    rec.ondataavailable = e => { if (e.data && e.data.size) delovi.push(e.data); };
    rec.onstop = async () => {
      tok.getTracks().forEach(t => t.stop()); clearInterval(tajmer);
      d.classList.remove('snima'); d.disabled = true; d.innerHTML = 'Prepisujem…';
      if (Date.now() - pocetak < 900) { vrati(); return tost('Snimak je prekratak. Držite dok govorite.'); }
      const blob = new Blob(delovi, { type: (rec.mimeType || tip || 'audio/webm') });
      try {
        const odg = await fetch(API, { method: 'POST', body: new URLSearchParams({ ...prijava(), kod: podaci.salon.kod || '', deo: 'glas', tip: blob.type, zvuk: await uBase64(blob) }) });
        if (odg.status === 401 && !uTelegramu) { zatvoriPanel(); return istekla(); }
        const j = await odg.json();
        if (!j.ok) throw new Error(j.greska || 'Nisam uspeo da razumem snimak.');
        upisi(j.tekst); haptika('medium');
      } catch (er) { tost(er.message || 'Nema veze sa serverom.'); }
      vrati();
    };
    rec.start(); pocetak = Date.now(); d.classList.add('snima');
    const prikazSata = () => { const sek = Math.floor((Date.now() - pocetak) / 1000); d.innerHTML = 'Zaustavi ' + Math.floor(sek / 60) + ':' + String(sek % 60).padStart(2, '0'); if (sek >= 120 && rec.state === 'recording') rec.stop(); };
    prikazSata(); tajmer = setInterval(prikazSata, 300);
  };
}

async function demoAkcija(p) {
  await cekaj(['objava', 'grafika'].includes(p.akcija) ? 1800 : 900);

    const o = { id: Date.now(), tip: 'post_kartica', slika: sl('#3E4A20', '#6B7C3C'), slike: [], slika_broj: 1, caption: p.napomena.charAt(0).toUpperCase() + p.napomena.slice(1) + ' ✨\nSačuvajte objavu da vam bude pri ruci, a za sva pitanja smo tu.\n\nZakažite termin porukom u DM.\n\n#salon #beograd', status: 'ceka_odobrenje' };
    o.slike = [o.slika]; d.ceka.unshift(o); d.brojke.ceka++; return { ok: true, objava: o, termin: 'u ' + (d.plan.find(t => !t.objava) || { dan: 'sledećem terminu' }).dan + ' u 19h' };
  }
  if (p.akcija === 'objava') {
    const slike = JSON.parse(p.slike).map(b => 'data:image/jpeg;base64,' + b);
    const o = { id: Date.now(), tip: 'post', slika: slike[0], slike, slika_broj: slike.length, caption: (p.napomena ? 'Rezultat koji se vidi: ' + p.napomena + ' ✨' : 'Novi rad iz našeg salona ✨') + '\nSvaki detalj je urađen sa pažnjom, da kosa izgleda negovano i posle nekoliko nedelja.\n\nZakažite termin porukom u DM.\n\n#frizer #beograd', status: 'ceka_odobrenje' };
    d.ceka.unshift(o); d.brojke.ceka++; return { ok: true, objava: o, termin: 'u ' + (d.plan.find(t => !t.objava) || { dan: 'sledećem terminu' }).dan + ' u 19h' };
  }
  if (p.akcija === 'story') { const o = { id: Date.now(), tip: 'story_tekst', slika: sl('#2B2B2B', '#4A3B36'), slike: [], caption: p.tekst, status: 'ceka_odobrenje' }; o.slike = [o.slika]; d.ceka.unshift(o); d.brojke.ceka++; return { ok: true, objava: o }; }
  const i = d.ceka.findIndex(o => String(o.id) === String(p.red_id)); const o = d.ceka[i];
  if (['kr', 'op', 'dt'].includes(p.akcija)) return { ok: true, caption: ({ kr: 'Kraća verzija: ', op: 'Opuštenije: ', dt: 'Nova verzija: ' })[p.akcija] + prvaRecenica(o.caption) + '\n\nZakažite termin porukom u DM.' };
  d.ceka.splice(i, 1); d.brojke.ceka--;
  if (p.akcija === 'ok') { if (o.tip === 'story_tekst') { d.brojke.story++; return { ok: true, poruka: 'Story je objavljen na Instagramu.' }; } const t = d.plan.find(x => !x.objava); if (t) t.objava = o; d.brojke.spremno++; return { ok: true, poruka: 'Odobreno! Izlazi ' + (t ? t.dan + ' u ' + t.sat : 'u sledećem terminu') + '.' }; }
  return { ok: true, poruka: 'U redu, ova objava neće biti objavljena.' };
}
